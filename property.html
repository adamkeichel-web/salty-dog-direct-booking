<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property | Salty Dog & Co.</title><style>body{margin:0;font:16px/1.6 Arial;color:#263940;background:#f8fbfb}a{text-decoration:none}.wrap{width:min(1050px,92%);margin:auto}.top{padding:20px 0}.top a{font-size:22px;font-weight:900;color:#173f55}.hero{min-height:360px;background:linear-gradient(135deg,#24758b,#5aa69c);display:grid;place-items:center;color:white;text-align:center}.hero h1{font-size:clamp(42px,7vw,72px);margin:8px}.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:190px;gap:8px;margin-top:28px}.gallery img{width:100%;height:100%;object-fit:cover;border-radius:14px}.gallery img:first-child{grid-row:span 2}.content{display:grid;grid-template-columns:1.5fr .7fr;gap:28px;padding:35px 0 50px}.panel{background:white;border:1px solid #d8e5e7;border-radius:20px;padding:26px}.meta{font-weight:850;color:#24758b}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#edf6f5;padding:7px 10px;border-radius:999px}.book{display:block;background:#173f55;color:white;padding:14px;border-radius:11px;text-align:center;font-weight:900}.note{color:#697b82;font-size:14px}@media(max-width:760px){.gallery{grid-template-columns:1fr 1fr;grid-auto-rows:150px}.gallery img:first-child{grid-column:span 2;grid-row:auto}.content{grid-template-columns:1fr}}</style></head><body><header class="wrap top"><a href="/">← Salty Dog & Co.</a></header><section class="hero" id="hero"><div><div id="destination"></div><h1 id="name">Loading stay…</h1><p id="headline"></p></div></section><div class="wrap gallery" id="gallery"></div><main class="wrap content"><article class="panel"><div class="meta" id="meta"></div><h2>About this stay</h2><p id="summary"></p><h2>Highlights</h2><div class="chips" id="highlights"></div></article><aside class="panel" id="availability"><h2>Check availability</h2><p>Live rates and availability will appear here after Beds24 is connected.</p><a class="book" id="airbnb" target="_blank" rel="noopener">View current Airbnb listing</a><p class="note">Direct checkout and Stripe payments are intentionally disabled during staging.</p></aside></main><script>const slug=new URLSearchParams(location.search).get('stay');fetch(`/properties/${slug}.json`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(p=>{document.title=`${p.name} | Salty Dog & Co.`;name.textContent=p.name;destination.textContent=p.destination;headline.textContent=p.headline;meta.textContent=`${p.type} · ${p.bedrooms} bedrooms · ${p.bathrooms} bathrooms · Sleeps ${p.guests}`;summary.textContent=p.summary;highlights.innerHTML=p.highlights.map(x=>`<span class="chip">${x}</span>`).join('');gallery.innerHTML=(p.gallery||[]).slice(0,5).map((x,i)=>`<img src="${x}" alt="${p.name} property photo ${i+1}" loading="${i?'lazy':'eager'}">`).join('');airbnb.href=p.airbnb;if(p.image)hero.style.background=`linear-gradient(#173f5577,#173f55bb),url('${p.image}') center/cover`}).catch(()=>{name.textContent='Property not found';headline.textContent='Return to the stays page to choose a property.'})</script></body></html>
