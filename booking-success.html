<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirming payment | Salty Dog & Co.</title><style>:root{--navy:#173f55;--sea:#5aa69c;--mist:#edf6f5;--ink:#263940}*{box-sizing:border-box}body{margin:0;background:var(--mist);color:var(--ink);font:16px/1.6 Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(620px,92%);background:#fff;border-radius:24px;padding:42px;box-shadow:0 18px 50px #173f5520;text-align:center}.mark{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--sea);color:#fff;font-size:32px;margin:auto}h1{color:var(--navy);line-height:1.15}.details{background:var(--mist);border-radius:14px;padding:15px;margin:18px 0;text-align:left}.details div{display:flex;justify-content:space-between;gap:20px}.details div+div{margin-top:5px}a{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:800;padding:13px 20px;border-radius:11px;margin-top:12px}.help{display:inline;background:none;color:var(--navy);padding:0;margin:0}</style></head><body><main class="card"><div class="mark" id="mark">…</div><h1 id="title">Confirming your payment</h1><p id="message">Please keep this page open while we verify your reservation.</p><div class="details" id="details" hidden></div><p>Need help? Call or text <a class="help" href="tel:+18509105390">850-910-5390</a>.</p><a href="/">Return to Salty Dog &amp; Co.</a></main><script>
const money=(cents,currency="usd")=>new Intl.NumberFormat("en-US",{style:"currency",currency:String(currency).toUpperCase()}).format(Number(cents||0)/100),date=value=>new Date(`${value}T00:00:00`).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const title=document.getElementById("title"),message=document.getElementById("message"),mark=document.getElementById("mark"),details=document.getElementById("details"),sessionId=new URLSearchParams(location.search).get("session_id");
async function verify(attempt=0){if(!sessionId){title.textContent="Confirmation link incomplete";message.textContent="Open the link provided by Stripe or contact us for help.";mark.textContent="!";return}try{const response=await fetch(`/api/direct-booking/confirmation?session_id=${encodeURIComponent(sessionId)}`),data=await response.json();if(data.confirmed){const b=data.booking;document.title="Payment received | Salty Dog & Co.";mark.textContent="✓";title.textContent="Your payment was received";message.textContent=`Thank you. Your reservation for ${date(b.checkin)} through ${date(b.checkout)} is confirmed.`;details.hidden=false;details.innerHTML=`<div><span>Booking total</span><strong>${money(b.total,b.currency)}</strong></div><div><span>Paid today</span><strong>${money(b.amountPaid,b.currency)}</strong></div>${b.balanceAmount>0?`<div><span>Balance due ${date(b.balanceDueAt.slice(0,10))}</span><strong>${money(b.balanceAmount,b.currency)}</strong></div>`:""}`;return}if(attempt<5){message.textContent="Payment received. Finalizing your reservation…";setTimeout(()=>verify(attempt+1),2000);return}throw new Error()}catch{mark.textContent="!";title.textContent="We are still confirming your reservation";message.textContent="Your payment may still be processing. Please do not submit another payment. Contact us if this message remains after a few minutes."}}
verify();
</script></body></html>
