name: Sync Airbnb photo order

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync photos from Airbnb
        run: node scripts/sync-airbnb-photos.mjs

      - name: Commit updated galleries
        run: |
          if git diff --quiet -- assets/properties properties; then
            echo "Airbnb photo galleries are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/properties properties
          git commit -m "Sync property photo order from Airbnb"
          git push
